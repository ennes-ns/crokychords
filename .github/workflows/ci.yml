name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  node:
    name: pnpm check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # SoundFont samples (docs/specs/soundfonts-v1.md §3): cached per manifest; the fetch verifies
      # every checksum (and downloads only what the cache lacks), so the build and the tests that
      # decode the shipped files run with them.
      - uses: actions/cache@v4
        with:
          path: apps/web/public/soundfonts
          key: soundfonts-${{ hashFiles('tools/soundfonts/manifest.json') }}
      - run: node tools/soundfonts/fetch.mjs
      - run: pnpm check
      - name: Work tree stays clean (samples and builds are git-ignored)
        run: |
          git status --porcelain
          test -z "$(git status --porcelain)" || { echo "::error::files changed or untracked after the check"; exit 1; }

  python:
    name: data tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/data
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run pytest -q

  rust:
    name: rust check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Rust goldens are fresh
        run: |
          scripts/gen-rust-golden.sh
          git diff --exit-code -- crates/croky-core/tests/golden \
            || { echo "::error::Rust goldens are stale; run scripts/gen-rust-golden.sh and commit"; exit 1; }
      - run: sudo apt-get update -q && sudo apt-get install -y -q libasound2-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: scripts/check-rust.sh
