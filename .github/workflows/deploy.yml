# Deploys the Worker (static web app + API) to Cloudflare on every push to main.
# Inert until the repository variable DEPLOY_ENABLED is set to 'true' (docs/specs/deploy-v1.md §7).
# Needs the secrets CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID; no ids or secrets in this file.
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy to Cloudflare
    if: vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # pnpm -r build orders core → web → api (api depends on web), so ../web/dist exists
      # before `wrangler deploy --dry-run`. VITE_SYNC=on enables cloud sync in the web build.
      - run: pnpm build
        env:
          VITE_SYNC: 'on'
      # Migrations first: new code never meets an old schema, and a failed migration stops the job.
      # Wrangler comes from apps/api/package.json (already installed above).
      - name: Apply D1 migrations
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: apps/api
          command: d1 migrations apply DB --remote
      - name: Deploy Worker (assets + API)
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: apps/api
          command: deploy
