# Emergency fallback for the automatic checks of pending community shares
# (docs/specs/moderation-v1.md §4). The job normally runs on the maintainer's own host
# (deploy/moderation, §4.1); this workflow has no schedule and runs only when started by hand.
# The job only writes a recommendation (auto verdict) onto each pending share; it never lists,
# rejects or deletes anything. The maintainer decides in /review.html.
#
# Inert until the repository variable MODERATION_ENABLED is "true". Setup: docs/specs/deploy-v1.md
# §4 step 13 (Access service token, MODERATION_TOKEN, variables). A runner outside the host's
# network may need an Access or WAF exception to reach the API.
name: Moderation (fallback)

on:
  workflow_dispatch:
    inputs:
      digest:
        description: Post the digest instead of checking
        type: boolean
        default: false

concurrency:
  group: moderation-${{ inputs.digest && 'digest' || 'check' }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  check:
    name: check pending shares
    if: vars.MODERATION_ENABLED == 'true' && !inputs.digest
    runs-on: ubuntu-latest
    environment: moderation
    timeout-minutes: 15
    defaults:
      run:
        working-directory: tools/moderation
    env:
      MODERATION_CACHE: ${{ github.workspace }}/.moderation-cache
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: tools/moderation/uv.lock
      - name: ffmpeg
        run: command -v ffmpeg || (sudo apt-get update -q && sudo apt-get install -y -q ffmpeg)
      # The open models (Whisper small, YAMNet) are downloaded once, SHA-256 checked, and cached.
      - uses: actions/cache@v4
        with:
          path: .moderation-cache
          key: moderation-models-v2-${{ hashFiles('tools/moderation/uv.lock', 'tools/moderation/policy.yaml') }}
          restore-keys: moderation-models-v2-
      - run: uv sync --frozen --group models
      - name: Model self-test
        run: MODERATION_MODELS=1 uv run pytest -q tests/test_models.py
      - name: Check pending shares
        run: uv run python run.py
        env:
          MODERATION_API_BASE: ${{ vars.MODERATION_API_BASE }}
          MODERATION_TOKEN: ${{ secrets.MODERATION_TOKEN }}
          MODERATION_ACCESS_CLIENT_ID: ${{ secrets.MODERATION_ACCESS_CLIENT_ID }}
          MODERATION_ACCESS_CLIENT_SECRET: ${{ secrets.MODERATION_ACCESS_CLIENT_SECRET }}

  digest:
    name: daily digest
    if: vars.MODERATION_ENABLED == 'true' && vars.MODERATION_INBOX_ISSUE != '' && inputs.digest
    runs-on: ubuntu-latest
    environment: moderation
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    defaults:
      run:
        working-directory: tools/moderation
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: tools/moderation/uv.lock
      - run: uv sync --frozen
      - name: Comment on the moderation inbox issue (counts only; nothing when the queue is empty)
        run: uv run python run.py --digest
        env:
          GITHUB_TOKEN: ${{ github.token }}
          MODERATION_INBOX_ISSUE: ${{ vars.MODERATION_INBOX_ISSUE }}
          MODERATION_API_BASE: ${{ vars.MODERATION_API_BASE }}
          MODERATION_TOKEN: ${{ secrets.MODERATION_TOKEN }}
          MODERATION_ACCESS_CLIENT_ID: ${{ secrets.MODERATION_ACCESS_CLIENT_ID }}
          MODERATION_ACCESS_CLIENT_SECRET: ${{ secrets.MODERATION_ACCESS_CLIENT_SECRET }}
