# Croky Chords: web app (static assets) + API (Hono) in one Worker. See docs/specs/deploy-v1.md.
# Production values; secrets stay out of this file (docs/specs/api-v1.md §2).
#
# Secrets (never in this file; `wrangler secret put <NAME>`, locally in .dev.vars):
#   ACCESS_TEAM_DOMAIN  <team>.cloudflareaccess.com of the Access organisation
#   ACCESS_AUD          Audience (AUD) tag of the Access application
name = "crokychords"
main = "src/index.ts"
compatibility_date = "2026-03-01"
workers_dev = false
# No Preview URLs either (on by default; workers_dev = false does not cover them). The API only
# trusts ALLOWED_ORIGIN, so a second hostname would not work anyway.
preview_urls = false
minify = true
upload_source_maps = true

# Production hostname.
# `wrangler deploy` creates the Custom Domain; it needs Workers Routes: Edit on the zone.
[[routes]]
pattern = "chords.cr0ky.com"
custom_domain = true

# The built web app (`pnpm --filter @crokychords/web build`). Static paths are served from the
# asset store without invoking the Worker; only /api/* runs the Worker first.
[assets]
directory = "../web/dist"
binding = "ASSETS"
run_worker_first = ["/api/*"]

[vars]
# The only browser origin the API accepts (the production hostname of the app this Worker
# serves); requests with any other Origin get 403. Placeholder; local dev overrides it in .dev.vars.
ALLOWED_ORIGIN = "https://chords.cr0ky.com"

[[d1_databases]]
binding = "DB"
database_name = "crokychords"
# Production database (D1 ids are not secrets).
database_id = "abeff41e-ec33-4ea0-8e88-11b94fd3fc09"
migrations_dir = "migrations"

[[r2_buckets]]
binding = "SAVES"
bucket_name = "crokychords-saves"
