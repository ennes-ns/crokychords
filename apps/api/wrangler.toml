# Croky Chords: web app (static assets) + API (Hono) in one Worker. See docs/specs/deploy-v1.md.
# Production values; secrets stay out of this file (docs/specs/api-v1.md §2).
#
# Secrets (never in this file; `wrangler secret put <NAME>`, locally in .dev.vars):
#   ACCESS_TEAM_DOMAIN  <team>.cloudflareaccess.com of the Access organisation
#   ACCESS_AUD          Audience (AUD) tag of the Access application
#   ANTHROPIC_API_KEY   key for the in-app assistant (docs/specs/assistant-v1.md §B2); without it
#                       the assistant says it is unavailable and nothing else changes
name = "crokychords"
main = "src/index.ts"
compatibility_date = "2026-03-01"
workers_dev = false
# No Preview URLs either (on by default; workers_dev = false does not cover them). The API only
# trusts ALLOWED_ORIGIN, so a second hostname would not work anyway.
preview_urls = false
minify = true
upload_source_maps = true

# Production hostname.
# `wrangler deploy` creates the Custom Domain; it needs Workers Routes: Edit on the zone.
[[routes]]
pattern = "chords.cr0ky.com"
custom_domain = true

# The built web app (`pnpm --filter @crokychords/web build`). Static paths are served from the
# asset store without invoking the Worker; only /api/* runs the Worker first.
[assets]
directory = "../web/dist"
binding = "ASSETS"
run_worker_first = ["/api/*"]

[vars]
# The only browser origin the API accepts (the production hostname of the app this Worker
# serves); requests with any other Origin get 403. Placeholder; local dev overrides it in .dev.vars.
ALLOWED_ORIGIN = "https://chords.cr0ky.com"
# The assistant (docs/specs/assistant-v1.md §B2): model, the daily cost cap for everyone together
# (USD, estimated from the reported tokens), per-user request limits, structured output and
# server-side fallback on a refusal.
# ASSISTANT_ENABLED: "true" shows the assistant in the app (also needs ANTHROPIC_API_KEY); any
# other value hides it completely and the route answers 503 assistant_unavailable.
ASSISTANT_ENABLED = "false"
ASSISTANT_MODEL = "claude-sonnet-5-5"
ASSISTANT_DAILY_BUDGET_USD = "1"
ASSISTANT_USER_DAILY_REQUESTS = "50"
ASSISTANT_USER_MINUTE_REQUESTS = "6"
ASSISTANT_OUTPUT = "schema"
ASSISTANT_FALLBACKS = "default"
# Maintainer e-mails for the community review queue (docs/specs/community-v1.md §3), comma
# separated. Empty here on purpose: no address is committed. The deploy workflow passes the
# repository secret ADMIN_EMAILS with `--var`, because `wrangler deploy` resets vars to this file.
ADMIN_EMAILS = ""

[[d1_databases]]
binding = "DB"
database_name = "crokychords"
# Production database (D1 ids are not secrets).
database_id = "abeff41e-ec33-4ea0-8e88-11b94fd3fc09"
migrations_dir = "migrations"

[[r2_buckets]]
binding = "SAVES"
bucket_name = "crokychords-saves"

# Weekly backups of D1 and SAVES (docs/specs/backups-v1.md): the backup bucket, the deployed
# version for the manifest, and the cron triggers. Monday 03:00 UTC starts the set; the second
# trigger resumes an unfinished set on the same Monday (a Free-plan invocation may make at most
# 1,000 subrequests to D1/R2) and otherwise ends after one D1 read.
[[r2_buckets]]
binding = "BACKUPS"
bucket_name = "crokychords-backups"

[version_metadata]
binding = "CF_VERSION_METADATA"

[triggers]
crons = ["0 3 * * 1", "5,20,35,50 3-11 * * 1"]
