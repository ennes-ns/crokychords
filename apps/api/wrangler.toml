# Croky Chords: web app (static assets) + API (Hono) in one Worker. See docs/specs/deploy-v1.md.
# Placeholders only; account-specific values are set at deploy time (docs/specs/api-v1.md §2).
#
# Secrets (never in this file; `wrangler secret put <NAME>`, locally in .dev.vars):
#   ACCESS_TEAM_DOMAIN  <team>.cloudflareaccess.com of the Access organisation
#   ACCESS_AUD          Audience (AUD) tag of the Access application
name = "crokychords"
main = "src/index.ts"
compatibility_date = "2026-03-01"
workers_dev = false
minify = true
upload_source_maps = true

# Production hostname (placeholder: replace with the real hostname before the first deploy).
# `wrangler deploy` creates the Custom Domain; it needs Workers Routes: Edit on the zone.
[[routes]]
pattern = "chords.example.com"
custom_domain = true

# The built web app (`pnpm --filter @crokychords/web build`). Static paths are served from the
# asset store without invoking the Worker; only /api/* runs the Worker first.
[assets]
directory = "../web/dist"
binding = "ASSETS"
run_worker_first = ["/api/*"]

[vars]
# A browser origin allowed by CORS besides the Worker's own origin (same-origin requests are
# always accepted). Placeholder; local dev overrides it in .dev.vars.
ALLOWED_ORIGIN = "https://chords.example.com"

[[d1_databases]]
binding = "DB"
database_name = "crokychords"
# Placeholder; replaced with the real database id when the database is created.
database_id = "00000000-0000-0000-0000-000000000000"
migrations_dir = "migrations"

[[r2_buckets]]
binding = "SAVES"
bucket_name = "crokychords-saves"
