<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" role="img" aria-label="Croky Chords logo: Croky the green-cheeked conure with a music note">
  <defs>
    <linearGradient id="wing" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3fd97e"/><stop offset="1" stop-color="#1f8f4a"/>
    </linearGradient>
    <linearGradient id="belly" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f1c40f"/><stop offset=".5" stop-color="#f08a2a"/><stop offset="1" stop-color="#e74c3c"/>
    </linearGradient>
    <linearGradient id="chest" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f6ecd6"/><stop offset="1" stop-color="#d8c19c"/>
    </linearGradient>
    <linearGradient id="tail" x1="1" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e74c3c"/><stop offset="1" stop-color="#8e1f1f"/>
    </linearGradient>
  </defs>

  <circle cx="128" cy="128" r="124" fill="#121212"/>
  <circle cx="128" cy="128" r="117" fill="none" stroke="#2ecc71" stroke-width="3" opacity=".4"/>

  <!-- tail -->
  <path d="M100 178 L34 232 Q26 220 38 204 L92 160 Z" fill="url(#tail)" stroke="#1a1a1a" stroke-width="5" stroke-linejoin="round"/>
  <path d="M92 172 L56 204" stroke="#6e1616" stroke-width="4" stroke-linecap="round" opacity=".6"/>

  <!-- body + neck as one silhouette -->
  <path d="M74 134 Q70 92 112 74 Q136 66 168 74 Q198 96 198 146 Q196 196 146 210 Q100 214 80 180 Q72 160 74 134 Z"
        fill="url(#wing)" stroke="#1a1a1a" stroke-width="5" stroke-linejoin="round"/>

  <!-- wing feathers, blue flight tips at the bottom -->
  <g stroke="#1a1a1a" stroke-width="4" stroke-linejoin="round">
    <path d="M80 152 Q64 178 74 200 Q94 188 106 166 Z" fill="#3498db"/>
    <path d="M86 136 Q72 166 86 192 Q108 176 116 146 Z" fill="#2a8fd8" opacity=".9"/>
    <path d="M94 120 Q82 150 98 182 Q122 164 126 128 Z" fill="#27ae60"/>
    <path d="M106 108 Q98 138 112 168 Q134 150 134 116 Z" fill="#2ecc71"/>
    <path d="M120 100 Q114 126 128 150 Q144 136 142 108 Z" fill="#3fd97e"/>
  </g>

  <!-- belly: low, yellow -> orange -> red -->
  <path d="M148 150 Q176 146 192 160 Q190 194 150 208 Q134 196 136 172 Q138 156 148 150 Z"
        fill="url(#belly)" stroke="#1a1a1a" stroke-width="4" stroke-linejoin="round"/>

  <!-- big scalloped chest from throat to belly -->
  <path d="M142 86 Q172 84 190 108 Q200 130 192 160 Q176 146 148 150 Q134 134 136 112 Q136 96 142 86 Z"
        fill="url(#chest)" stroke="#1a1a1a" stroke-width="4" stroke-linejoin="round"/>
  <g fill="none" stroke="#8b7555" stroke-width="2.4" stroke-linecap="round" opacity=".85">
    <path d="M146 100 q6 -5 12 0 q6 -5 12 0 q6 -5 12 0"/>
    <path d="M142 112 q6 -5 12 0 q6 -5 12 0 q6 -5 12 0 q6 -5 12 0"/>
    <path d="M144 124 q6 -5 12 0 q6 -5 12 0 q6 -5 12 0 q6 -5 12 0"/>
    <path d="M150 136 q6 -5 12 0 q6 -5 12 0 q6 -5 12 0"/>
    <path d="M160 148 q6 -5 12 0 q6 -5 12 0"/>
  </g>

  <!-- head: green cheeks, dark crown, grey ear patch -->
  <path d="M110 74 Q118 40 158 38 Q198 40 206 78 Q208 100 194 108 Q170 100 142 100 Q118 96 110 74 Z"
        fill="#2ecc71" stroke="#1a1a1a" stroke-width="5" stroke-linejoin="round"/>
  <path d="M110 74 Q118 40 158 38 Q194 40 205 72 Q184 58 156 60 Q128 62 112 80 Z"
        fill="#3b2a26" stroke="#1a1a1a" stroke-width="5" stroke-linejoin="round"/>
  <path d="M150 74 Q166 68 182 78 Q180 94 164 98 Q148 92 150 74 Z" fill="#aab3b8" opacity=".5"/>

  <!-- hooked beak -->
  <path d="M198 70 Q228 72 226 96 Q224 114 208 118 Q204 104 194 96 Q200 84 198 70 Z"
        fill="#2b2b2b" stroke="#1a1a1a" stroke-width="4" stroke-linejoin="round"/>
  <path d="M196 98 Q210 100 216 108" stroke="#777" stroke-width="3" stroke-linecap="round" fill="none"/>

  <!-- eye with white ring -->
  <circle cx="178" cy="66" r="12" fill="#fff" stroke="#1a1a1a" stroke-width="3"/>
  <circle cx="179" cy="66" r="7" fill="#1a1a1a"/>
  <circle cx="181.5" cy="63.5" r="2.4" fill="#fff"/>

  <!-- feet -->
  <g stroke="#1a1a1a" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
    <path d="M126 208 l-8 12 M126 208 l2 16 M126 208 l12 10"/>
    <path d="M156 206 l-4 16 M156 206 l8 14 M156 206 l14 8"/>
  </g>

  <!-- music note -->
  <g fill="#f1c40f" stroke="#1a1a1a" stroke-width="3" stroke-linejoin="round">
    <path d="M60 52 V92" stroke-linecap="round"/>
    <ellipse cx="51" cy="93" rx="10" ry="7"/>
    <path d="M60 52 Q82 58 82 78 Q80 66 60 65 Z"/>
  </g>
</svg>
