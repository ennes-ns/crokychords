<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 440" width="1600" height="440" role="img" aria-label="Croky Chords. Write chords. Hear what comes next.">
  <!--
    README banner. The logomark (apps/web/public/brand/croky-mark.svg) is inlined at the
    @mark placeholder by docs/readme/render-banner.mjs; run it from the repository root:
      node docs/readme/render-banner.mjs
  -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#121212"/>
      <stop offset="0.55" stop-color="#141716"/>
      <stop offset="1" stop-color="#121a16"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#2ecc71" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#2ecc71" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="rule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2ecc71" stop-opacity="0.6"/>
      <stop offset="1" stop-color="#2ecc71" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="1600" height="440" fill="url(#bg)"/>
  <circle cx="250" cy="220" r="230" fill="url(#glow)"/>

  <!-- logomark -->
  <g transform="translate(100 70) scale(1.171875)">
    <!-- @mark -->
  </g>

  <!-- wordmark -->
  <text x="470" y="206" font-family="'Adwaita Sans','Nimbus Sans','Avenir Next','Segoe UI',Inter,system-ui,sans-serif" font-weight="800" font-size="150" letter-spacing="-4"><tspan fill="#2ecc71">Croky</tspan><tspan fill="#f2e5bc" dx="34">Chords</tspan></text>

  <rect x="474" y="238" width="520" height="3" rx="1.5" fill="url(#rule)"/>

  <!-- tagline -->
  <text x="474" y="306" font-family="'Adwaita Sans','Nimbus Sans','Segoe UI',Inter,system-ui,sans-serif" font-weight="600" font-size="46" fill="#3498db" letter-spacing="0.5">Write chords. Hear what comes next.</text>

  <!-- chord tokens -->
  <g font-family="'Adwaita Sans','Nimbus Sans','Segoe UI',Inter,system-ui,sans-serif" font-weight="700" font-size="28" text-anchor="middle">
    <g transform="translate(474 338)">
      <rect width="84" height="50" rx="12" fill="#1d2027" stroke="#2ecc71" stroke-opacity="0.55" stroke-width="2"/>
      <text x="42" y="35" fill="#f2e5bc">I</text>
    </g>
    <g transform="translate(578 338)">
      <rect width="84" height="50" rx="12" fill="#1d2027" stroke="#3498db" stroke-opacity="0.55" stroke-width="2"/>
      <text x="42" y="35" fill="#f2e5bc">V</text>
    </g>
    <g transform="translate(682 338)">
      <rect width="84" height="50" rx="12" fill="#1d2027" stroke="#e74c3c" stroke-opacity="0.55" stroke-width="2"/>
      <text x="42" y="35" fill="#f2e5bc">vi</text>
    </g>
    <g transform="translate(786 338)">
      <rect width="84" height="50" rx="12" fill="#1d2027" stroke="#f1c40f" stroke-opacity="0.55" stroke-width="2"/>
      <text x="42" y="35" fill="#f2e5bc">IV</text>
    </g>
    <g transform="translate(890 338)">
      <rect width="112" height="50" rx="12" fill="#2ecc71" fill-opacity="0.14" stroke="#2ecc71" stroke-width="2"/>
      <text x="56" y="35" fill="#2ecc71">? 78%</text>
    </g>
  </g>
</svg>
