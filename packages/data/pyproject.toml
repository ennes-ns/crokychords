[project]
name = "crokychords-data"
version = "0.1.0"
description = "Builds the n-gram chord-suggestion tables (ngrams.json) that @crokychords/core loads."
requires-python = ">=3.11"
license = "MIT"
dependencies = []

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["crokychords_data"]
