# Moderation policy v1 (docs/specs/moderation-v1.md §1). The job only recommends: a flag sets
# auto_verdict = flag:<category>, a note shows as borderline; the maintainer decides.
# tests/test_policy_table.py keeps this file and the spec's table in step.
id: moderation-v1/1

# When several rules flag, the verdict names the first of these categories.
order: [sexual, violence, hate, personal, speech, copyright, loudness, quality]

quality:
  max_duration_s: 30
  silence_peak_dbfs: { flag: -60, note: -45 }

loudness:
  # Sustained clipping: true peak above 0 dBTP and at least this share of samples in runs of
  # clip_run or more consecutive samples at or above clip_level (full scale = 1.0).
  true_peak_dbtp: 0.0
  clip_level: 0.999
  clip_run: 4
  clipped_ratio: { flag: 0.001 }
  integrated_lufs: { flag: -5, note: -8 }

speech:
  # A segment whose no-speech probability is above this is dropped from the transcript.
  max_no_speech_prob: 0.6
  # A single word below this probability is dropped (Whisper invents words on short clips).
  min_word_probability: 0.5
  # Words outside this list count as words (rule 6). Repeated letters are collapsed first;
  # single characters are not words.
  allow:
    [
      a,
      ah,
      aah,
      aha,
      ay,
      aye,
      eh,
      ehh,
      ha,
      hah,
      haha,
      he,
      hey,
      hi,
      hm,
      hmm,
      hmmm,
      ho,
      hoo,
      huh,
      la,
      lala,
      mm,
      mmm,
      mhm,
      na,
      nah,
      ne,
      o,
      oh,
      ohh,
      ooh,
      oooh,
      oo,
      uh,
      uhh,
      uh-huh,
      um,
      wa,
      wah,
      wo,
      woah,
      woo,
      whoa,
      ya,
      yah,
      yay,
      ye,
      yeah,
      yeh,
      yo,
    ]
  max_words_outside_allow: 0
  # Rule 7: VAD speech share of the sample, together with a transcript of at least vad_min_words
  # words (any words, so a chanted "hey hey hey hey" counts; "oh yeah" does not).
  vad_ratio: { flag: 0.40, note: 0.25 }
  vad_min_words: 3

# Rules 8-15: YAMNet (AudioSet) display names; max score over frames.
events:
  - { rule: 8, category: violence, what: screaming, classes: [Screaming], flag: 0.35, note: 0.15 }
  - {
      rule: 9,
      category: violence,
      what: crying,
      classes: ['Crying, sobbing', 'Baby cry, infant cry', Whimper],
      flag: 0.40,
      note: 0.20,
    }
  - {
      rule: 10,
      category: violence,
      what: shouting,
      classes: [Shout, Yell, Bellow, Children shouting],
      flag: 0.70,
      note: 0.30,
    }
  - {
      rule: 11,
      category: violence,
      what: gunshots,
      classes: ['Gunshot, gunfire', Machine gun, Fusillade, Artillery fire, Cap gun],
      flag: 0.40,
      note: 0.20,
    }
  - {
      rule: 12,
      category: violence,
      what: explosions,
      classes: [Explosion, Eruption],
      flag: 0.60,
      note: 0.30,
    }
  - {
      rule: 13,
      category: sexual,
      what: moaning,
      classes: ['Wail, moan', Groan],
      flag: 0.35,
      note: 0.15,
    }
  - {
      rule: 14,
      category: sexual,
      what: heavy breathing,
      classes: [Pant, Gasp, Breathing],
      note: 0.30,
    }
  - {
      rule: 15,
      category: speech,
      what: speech-like sound,
      classes:
        [
          Speech,
          Conversation,
          'Narration, monologue',
          Babbling,
          Speech synthesizer,
          Whispering,
          'Hubbub, speech noise, speech babble',
        ],
      note: 0.50,
    }

text:
  # Whole words after lower-casing and folding (rule 16). Deliberately short: Llama Guard
  # (rule 18) covers the long tail; extend here when something slips through.
  fold: { '0': o, '1': i, '3': e, '4': a, '5': s, '7': t, '@': a, '$': s }
  words:
    hate: [nazi, nazis, heil, sieg, '1488', kkk, swastika, white-power, whitepower]
    sexual: [porn, porno, sex, sexy, nsfw, orgasm, moan, moaning, cum, xxx, nude, naked, rape]
    violence:
      [kill, killing, murder, murdered, gore, gunshot, execution, suicide, torture, massacre]
  # Llama Guard 3 hazard codes → category (rule 18); unmapped unsafe codes become a note.
  guard_model: '@cf/meta/llama-guard-3-8b'
  guard_categories:
    S1: violence
    S9: violence
    S11: violence
    S3: sexual
    S4: sexual
    S12: sexual
    S10: hate
    S7: personal

models:
  # Whisper small (CTranslate2), fetched file by file at a pinned commit, each SHA-256 checked.
  asr:
    name: faster-whisper
    size: small
    compute_type: int8
    repo: Systran/faster-whisper-small
    revision: 536b0662742c02347bc0e980a01041f333bce120
    files:
      config.json: b55496ac7940a7ae47d2c01eab40edfd8701feec1229d9cce3b40014383fb828
      model.bin: 3e305921506d8872816023e4c273e75d2419fb89b24da97b4fe7bce14170d671
      tokenizer.json: fb7b63191e9bb045082c79fd742a3106a12c99513ab30df4a0d47fa6cb6fd0ab
      vocabulary.txt: 34ce3fe1c5041027b3f8d42912270993f986dbc4bb34cf27f951e34a1e453913
  vad: { name: silero-vad, source: faster-whisper bundled v5 }
  events:
