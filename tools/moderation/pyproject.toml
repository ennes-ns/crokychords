[project]
name = "crokychords-moderation"
version = "0.1.0"
description = "Automatic checks for shared community samples: writes a recommendation (auto verdict) for the maintainer's review queue; never lists, rejects or deletes."
requires-python = ">=3.11,<3.14"
license = "MIT"
dependencies = ["numpy>=1.26", "scipy>=1.11", "pyloudnorm>=0.1.1", "pyyaml>=6"]

[dependency-groups]
dev = ["pytest>=8"]
# The open models, only for the scheduled job (and a local dry run); the unit tests do not need them.
models = ["faster-whisper>=1.1", "ai-edge-litert>=1.2"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["crokychords_moderation"]
